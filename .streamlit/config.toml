# Streamlit theme for the Currency Converter app.
# Colours are hex codes: change any value to restyle the app.

[theme]
base = "light"
primaryColor = "#800020"               # burgundy buttons
backgroundColor = "#F3E6DC"            # nude page
secondaryBackgroundColor = "#FBF5F0"   # cream inputs
textColor = "#2A1215"                  # dark maroon text
font = "sans serif"

[browser]
gatherUsageStats = false
